name: CI/CD Pipeline with Fallback to Dev Deployment

on:
  push:
    branches:
      - github_actions
      - main
      - qa
      - dev
  pull_request:
    branches:
      - main
      - qa
      - dev

jobs:
  build:
    name: Build the Application
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      DEBUG: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint

      - name: Run Tests
        run: npm test

  deploy:
    name: Deploy Application
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        env:
          API_KEY: ${{ secrets.DEV_API_KEY }}
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          echo "Deploying to Dev environment..."
          echo "Using API Key: $API_KEY"
          echo "Database URL: $DATABASE_URL"

      - name: Deploy to QA
        if: github.ref == 'refs/heads/qa'
        env:
          API_KEY: ${{ secrets.QA_API_KEY }}
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
        run: |
          echo "Deploying to QA environment..."
          echo "Using API Key: $API_KEY"
          echo "Database URL: $DATABASE_URL"

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        env:
          API_KEY: ${{ secrets.PROD_API_KEY }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Deploying to Production environment..."
          echo "Using API Key: $API_KEY"
          echo "Database URL: $DATABASE_URL"

      - name: Deploy to GitHub Actions
        if: github.ref == 'refs/heads/github_actions'
        env:
          API_KEY: ${{ secrets.GITHUB_ACTIONS_API_KEY }}
          DATABASE_URL: ${{ secrets.GITHUB_ACTIONS_DATABASE_URL }}
        run: |
          echo "Deploying to GitHub Actions test environment..."
          echo "Using API Key: $API_KEY"
          echo "Database URL: $DATABASE_URL"

      - name: Deploy to Dev as Fallback
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/qa' && github.ref != 'refs/heads/github_actions' && github.ref != 'refs/heads/dev'
        env:
          API_KEY: ${{ secrets.DEV_API_KEY }}
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          echo "Fallback: Deploying to Dev environment..."
          echo "Using API Key: $API_KEY"
          echo "Database URL: $DATABASE_URL"
