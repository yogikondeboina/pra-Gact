name: CI/CD Pipeline with Environments

on:
  push:
    branches:
      - github_actions
      - main
      - qa
      - dev
  pull_request:
    branches:
      - main
      - qa
      - dev

jobs:
  build:
    name: Build the Application
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      DEBUG: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint

      - name: Run Tests
        run: npm test

  deploy:
    name: Deploy Application
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, qa, prod, github_actions]
    env:
      NODE_ENV: ${{ matrix.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Environment
        run: |
          echo "Deploying to ${{ matrix.environment }} environment..."
          echo "Using API Key: ${{ secrets[format('{0}_API_KEY', matrix.environment)] }}"
          echo "Database URL: ${{ secrets[format('{0}_DATABASE_URL', matrix.environment)] }}"
          # Replace with actual deployment logic
